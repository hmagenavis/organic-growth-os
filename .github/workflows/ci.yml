name: CI

# The authoritative security verifier, and it touches no cloud environment: the
# database it tests is created, migrated and destroyed inside the runner. Supabase
# staging is a deployment target, never a substitute for this
# (docs/cloud/CLOUD-ARCHITECTURE.md). Nothing here holds a staging credential; the
# workflow that does is manual-dispatch only (staging-database.yml).

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run, so a verification result can be refreshed without an empty commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Real PostgreSQL via Testcontainers: Row Level Security, tenant isolation and
      # the authentication, authorization and administration paths are never verified
      # against a substitute engine (docs/TESTING.md §2). Covers the database package
      # (membership bootstrap policies, member administration, the concurrency race on
      # the last-agency-admin invariant, first-organization provisioning, and the
      # 0003→0004 and 0004→0005 upgrade migrations) and the API's authentication,
      # authorization and member-administration endpoints.
      - name: Integration tests (PostgreSQL)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      # docs/SECURITY.md §8: no dependency with a known critical vulnerability.
      - name: Audit (critical)
        run: pnpm audit --audit-level critical
